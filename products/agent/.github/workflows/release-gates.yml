name: Release gates

# The checks a RELEASE needs and a push does not. They are slower, and what they
# measure changes rarely, so they run:
#
#   - from ci.yml, before auto-release, on a push to main whose version has no
#     tag yet (auto-release `needs` this workflow, so no version is tagged
#     without it); the built binary is the one that run's `build` job made;
#   - nightly, so drift shows up within a day;
#   - on demand (Actions > Release gates > Run workflow).
#
#   e2e        the built binary in a real terminal with an isolated GoodVibes
#              daemon on a spare port: the Agent adopts the running daemon,
#              the daemon goes away and comes back, and the Agent re-adopts it
#              (startup and a first turn run per push, in ci.yml)

on:
  workflow_call:
    inputs:
      ci-build-artifact:
        description: Name of an artifact in the calling run that holds dist/goodvibes-agent-linux-x64.
        type: string
        required: false
        default: ""
  workflow_dispatch:
  schedule:
    # Nightly, 07:45 UTC.
    - cron: "45 7 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end (release set)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install tmux (the E2E terminal)
        run: command -v tmux || (sudo apt-get update -q && sudo apt-get install -y -q tmux)
      - name: Download the calling run's build
        if: ${{ inputs.ci-build-artifact }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.ci-build-artifact }}
          path: dist/
      - name: Build (linux-x64), when not called with a build
        if: ${{ !inputs.ci-build-artifact }}
        run: bun run build:linux-x64
      - name: Restore executable bit
        run: chmod +x dist/goodvibes-agent-linux-x64
      - name: Daemon drop and re-adoption
        env:
          GOODVIBES_E2E_BINARY: dist/goodvibes-agent-linux-x64
        run: bun run test:e2e:release
