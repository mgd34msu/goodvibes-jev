name: Setup Bun + dependencies
description: >-
  Pin Bun, restore its install cache, and run `bun install --frozen-lockfile`.
  THE single setup for the Agent repo, the shared GoodVibes setup pattern: one
  pinned Bun version, cache always on, frozen lockfile always.

inputs:
  bun-version:
    # NOTE: GitHub template-evaluates action metadata INCLUDING descriptions, and
    # the vars context does not exist in composite actions, a literal
    # dollar-brace expression anywhere in this file fails every job at load
    # time. Keep this text expression-free.
    description: Bun version to pin. Single source of truth for this repo;
      callers may override the default with a repo variable.
    required: false
    # 1.3.14: 1.3.10's `bun build --compile` had a module-scope symbol-dedup bug
    # that emitted an undefined `SnapshotPruner2` reference in the darwin-arm64
    # daemon bundle (SDK 1.0.0), crashing the macos-arm64 daemon smoke at
    # startup. 1.3.14 produces a correct bundle on every target.
    default: "1.3.14"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Restore Bun install cache
      id: bun-cache-restore
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
    - name: Save Bun install cache
      if: always() && steps.bun-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
